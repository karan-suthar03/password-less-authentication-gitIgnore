name: Deploy SaaS to EC2

on:
  push:
    branches: [main]
    paths:
      - "SaaS/**"
      - "deploy/**"
      - ".github/workflows/deploy-saas.yml"
  workflow_dispatch: # allow manual trigger

env:
  APP_DIR: /home/ubuntu/app # remote directory on EC2

jobs:
  deploy:
    name: Deploy SaaS Backend & Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build frontend ────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: SaaS/frontend
        run: npm ci

      - name: Build frontend
        working-directory: SaaS/frontend
        run: npm run build
        env:
          # Vite replaces import.meta.env vars at build time
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ── Deploy via SSH ────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload code to EC2
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'SaaS/frontend/node_modules' \
            --exclude 'SaaS/backend/node_modules' \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no" \
            SaaS/backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$APP_DIR/backend/

      - name: Upload frontend build to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no" \
            SaaS/frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$APP_DIR/frontend/dist/

      - name: Upload deployment configs to EC2
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no" \
            deploy/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$APP_DIR/deploy/

      - name: Install dependencies & restart services
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'DEPLOY_SCRIPT'

            set -e

            echo "── Installing backend dependencies ──"
            cd $HOME/app/backend
            npm ci --omit=dev

            echo "── Restarting backend with PM2 ──"
            cd $HOME/app
            pm2 startOrRestart deploy/ecosystem.config.cjs --env production
            pm2 save

            echo "── Reloading Nginx ──"
            sudo cp deploy/nginx-saas.conf /etc/nginx/sites-available/saas
            sudo ln -sf /etc/nginx/sites-available/saas /etc/nginx/sites-enabled/saas
            sudo nginx -t && sudo systemctl reload nginx

            echo "✓ Deployment complete!"
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
