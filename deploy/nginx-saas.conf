# ──────────────────────────────────────────────────────────
# Nginx config for SaaS app
#   - Serves frontend static build
#   - Reverse-proxies /api/* and /sdk/* to Node backend
# ──────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;   # Replace _ with your domain (e.g. saas.example.com)

    # ── Frontend (Vite build output) ──────────────────────
    root /home/ubuntu/app/frontend/dist;
    index index.html;

    # SPA: serve index.html for any route not matching a file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ─────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # ── SDK endpoint proxy ────────────────────────────────
    location /sdk/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
}
