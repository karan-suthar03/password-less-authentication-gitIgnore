<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PassKey SDK — Browser Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; background: #0a0a0f; color: #e4e4e7; }
    h1   { color: #818cf8; }
    .card { background: #111118; border: 1px solid #27272a; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.85rem; color: #a1a1aa; }
    input { width: 100%; padding: 0.55rem 0.85rem; border: 1px solid #27272a; border-radius: 6px; background: #18181b; color: #e4e4e7; font-size: 0.9rem; box-sizing: border-box; }
    button { margin-top: 0.75rem; padding: 0.6rem 1.25rem; background: #818cf8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #6366f1; }
    pre  { background: #18181b; border: 1px solid #27272a; border-radius: 6px; padding: 1rem; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; margin-top: 0.75rem; }
    .success { color: #22c55e; }
    .error   { color: #ef4444; }
  </style>
</head>
<body>

<h1>🔑 PassKey SDK Demo</h1>

<!-- ── Config ── -->
<div class="card">
  <label>Backend Base URL</label>
  <input id="baseUrl" value="http://localhost:4000" />
  <label style="margin-top:0.75rem">API Key</label>
  <input id="apiKey" placeholder="pl_live_..." />
  <button onclick="checkStatus()">Check Status</button>
  <pre id="statusOut"></pre>
</div>

<!-- ── Register ── -->
<div class="card">
  <label>Register a User</label>
  <input id="regEmail" placeholder="user@example.com" />
  <input id="regName"  placeholder="Display name (optional)" style="margin-top:0.5rem" />
  <button onclick="doRegister()">Register</button>
  <pre id="regOut"></pre>
</div>

<!-- ── Login ── -->
<div class="card">
  <label>Start Login (get OTP)</label>
  <input id="loginEmail" placeholder="user@example.com" />
  <button onclick="doLogin()">Send OTP</button>
  <pre id="loginOut"></pre>
</div>

<!-- ── Verify ── -->
<div class="card">
  <label>Verify OTP</label>
  <input id="challengeId" placeholder="challengeId (auto-filled)" />
  <input id="otpCode"     placeholder="6-digit code" style="margin-top:0.5rem" maxlength="6" />
  <button onclick="doVerify()">Verify</button>
  <pre id="verifyOut"></pre>
</div>

<!-- ── List Users ── -->
<div class="card">
  <button onclick="doListUsers()">List Users</button>
  <pre id="usersOut"></pre>
</div>

<script type="module">
  // ── Inline SDK (no build step needed for browser demo) ──
  class PasskeyError extends Error {
    constructor(message, status, body = {}) {
      super(message);
      this.name = "PasskeyError";
      this.status = status;
      this.body = body;
    }
  }

  class PasskeyClient {
    constructor({ baseUrl, apiKey }) {
      this._base   = baseUrl.replace(/\/$/, "") + "/sdk";
      this._apiKey = apiKey;
    }
    async _request(method, path, body = null) {
      const headers = { "x-api-key": this._apiKey };
      if (body !== null) headers["Content-Type"] = "application/json";
      const init = { method, headers };
      if (body !== null) init.body = JSON.stringify(body);
      let res;
      try { res = await fetch(this._base + path, init); }
      catch (e) { throw new PasskeyError(`Network error: ${e.message}`, 0); }
      let data;
      try { data = await res.json(); } catch { data = {}; }
      if (!res.ok) throw new PasskeyError(data.error || `HTTP ${res.status}`, res.status, data);
      return data;
    }
    status()                       { return this._request("GET",  "/auth/status"); }
    register(email, displayName)   {
      const b = { email };
      if (displayName) b.displayName = displayName;
      return this._request("POST", "/auth/register", b);
    }
    login(email)                   { return this._request("POST", "/auth/login",  { email }); }
    verify(challengeId, code)      { return this._request("POST", "/auth/verify", { challengeId, code }); }
    listUsers()                    { return this._request("GET",  "/auth/users"); }
  }

  function getClient() {
    return new PasskeyClient({
      baseUrl: document.getElementById("baseUrl").value.trim(),
      apiKey:  document.getElementById("apiKey").value.trim(),
    });
  }

  function render(el, data, isError = false) {
    const pre = document.getElementById(el);
    pre.textContent = JSON.stringify(data, null, 2);
    pre.className = isError ? "error" : "success";
  }

  window.checkStatus = async () => {
    try { render("statusOut", await getClient().status()); }
    catch (e) { render("statusOut", { error: e.message, status: e.status }, true); }
  };

  window.doRegister = async () => {
    const email = document.getElementById("regEmail").value.trim();
    const name  = document.getElementById("regName").value.trim();
    try { render("regOut", await getClient().register(email, name || undefined)); }
    catch (e) { render("regOut", { error: e.message, status: e.status }, true); }
  };

  window.doLogin = async () => {
    const email = document.getElementById("loginEmail").value.trim();
    try {
      const res = await getClient().login(email);
      render("loginOut", res);
      document.getElementById("challengeId").value = res.challengeId;
      document.getElementById("otpCode").value     = res.code ?? "";

    }
    catch (e) { render("loginOut", { error: e.message, status: e.status }, true); }
  };

  window.doVerify = async () => {
    const challengeId = document.getElementById("challengeId").value.trim();
    const code        = document.getElementById("otpCode").value.trim();
    try { render("verifyOut", await getClient().verify(challengeId, code)); }
    catch (e) { render("verifyOut", { error: e.message, status: e.status }, true); }
  };

  window.doListUsers = async () => {
    try { render("usersOut", await getClient().listUsers()); }
    catch (e) { render("usersOut", { error: e.message, status: e.status }, true); }
  };
</script>
</body>
</html>
